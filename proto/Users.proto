syntax = "proto3";

package pb;

option go_package = "github.com/koliader/tellmi-users";

service Users {
  rpc Register(RegisterReq) returns (AuthRes) {}
  rpc Login(LoginReq) returns (AuthRes) {}
  rpc GetUserById(IdReq) returns (UserRes) {}
}

message RegisterReq {
  int64 id = 1;
  string username = 2;
  string password = 3;
}

message LoginReq {
  string username = 2;
  string password = 3;
}

message AuthRes {
  string token = 1;
}

message IdReq {
  int64 id = 1;
}

message UserRes {
  User user = 1;
}
